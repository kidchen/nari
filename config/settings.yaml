# Nari automation hub — PUBLIC defaults (committed to git).
# Put your real values in config/settings.local.yaml (git-ignored); it is deep-merged over this file:
# dicts merge key by key, lists and scalars replace, `key: null` deletes a key, and a dict with
# `_replace: true` replaces that whole section (use it for profiles and zips).
# Secrets (tokens, passwords) live in .env.

timezone: America/Los_Angeles

# People who can register with the bot: /start <INVITE_CODE>, then tap your name.
# features: what each person may get — "all" or a list of: market, realestate, cards, expenses, biorxiv, placeholder, vmhealth.
# Admin-only features (placeholder) are only ever given to the primary profile.
# Within that, people pause/resume their own features in the bot (/features, /pause, /resume).
profiles:
  me:
    name: Me
    primary: true        # gets job-error alerts, /status and /run
    features: all
    # email_from: [me@example.com]   # forwarded 5% emails from this address are this person's
    # placeholder: {label: Monthly parking, amount: "$100.00"}
    # real_estate: {zips: ["94110"], max_price: 1500000, searches: [my search]}   # narrow your own alerts
    # biorxiv:                       # new bioRxiv preprints on your topics, summarized (feature: biorxiv)
    #   categories: [cell biology, neuroscience]     # bioRxiv subject names; empty = all
    #   keywords: [single-cell, CRISPR]              # title/abstract, case-insensitive; order = ranking priority
    #   schedule: "0 8 * * 1-5"                      # cron string or {day_of_week: mon-fri, hour: 8}
    #   context: [cortex|cortical]                  # optional: a paper must ALSO mention one of these
    #   max_papers: 12
    #   include_revisions: false
    #   recap_after_days: 7            # nothing sent this long -> a recap (sent papers + near misses); 0 = off
    #   recap_window_days: 14
  partner:
    name: Partner
    features: [realestate]

# Module A — monthly parking placeholder (clearly watermarked, no vendor branding). ADMIN ONLY.
# Defaults below; override label/amount with profiles.<admin id>.placeholder.
placeholder:
  enabled: true
  label: Monthly parking
  amount: "$0.00"
  schedule: {day: 1, hour: 8, minute: 0}

# Shared Gemini (Google AI Studio) settings. GEMINI_API_KEY in .env.
llm:
  # Tried in order. Benchmarked 2026-10-13 (3 calls each, free tier): 3.6-flash, 3.5-flash-lite and
  # 3.1-flash-lite were 3/3 OK; 3.8/3.7-flash 0/3 (503); 3.5-flash 2/3. Avoid "-latest" aliases
  # (they change underneath you; flash-latest took 111s once). gemini-2.5-* is closed to new keys.
  # Free-tier RPM: 3.6/3.7/3.8-flash = 5/min, 3.5/3.1-flash-lite = 60/min. Usage is ~1 call/weekday
  # for the digest, so RPM isn't a constraint there; 429s fall through to the next model anyway.
  models: [gemini-3.6-flash, gemini-3.5-flash-lite, gemini-3.1-flash-lite]          # market catalysts
  extraction_models: [gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-3.6-flash]  # Redfin email fallback (bursty)
  # Morning brief: quality matters and it runs ~once per person per day, so retry the stronger models
  # through 503 "high demand" spikes before falling back to lite.
  brief_models: [gemini-3.6-flash, gemini-3.5-flash, gemini-3.5-flash-lite]
  brief_attempts_per_model: 3
  brief_backoff_seconds: 20
  timeout_seconds: 45

# Module B — real estate + mortgage rates
real_estate:
  enabled: true
  # The Redfin saved search does the real filtering (its name + filters head the report).
  # Optional extra cap, e.g. to drop Redfin's "similar homes" suggestions above budget:
  max_price: null
  # Source: Redfin saved-search alert emails in Gmail (GMAIL_ADDRESS / GMAIL_APP_PASSWORD in .env).
  email:
    sender: redfin.com
    mailbox: INBOX
    lookback_days: 14           # emails older than this are ignored; processed ones are never re-read
    llm_fallback: true          # use Gemini if a Redfin email layout isn't recognized
  # zip -> city. Listings outside these zips are dropped.
  zips:                         # example; set your own in settings.local.yaml
    "94103": San Francisco
  # Gmail check every 2 hours, 7am–9pm: ONE IMAP login per check covers Redfin alerts and the issuers'
  # 5% card emails (see cards.email). Silent unless something is new.
  # New listings / price changes / back-on-market arrive as photo messages; sold + suggestions as text.
  alerts_schedule: {minute: 0, hour: "7-21/2"}   # 7, 9, 11am, 1, 3, 5, 7, 9pm
  photos: true
  # Alerts are delivered per person. Someone who registers or resumes later gets the alerts from the
  # last N days they haven't seen (never older than their registration).
  catch_up_days: 3

mortgage:                       # sent to everyone with the realestate feature
  series: [MORTGAGE30US, MORTGAGE15US]
  schedule: {day_of_week: thu, hour: 18, minute: 0}   # Freddie Mac publishes Thursdays ~noon ET

# Module C — morning market brief (per person: their portfolio + watchlist, managed in the bot with
# /portfolio and /watch). For each stock with real news Gemini writes what happened / why it matters /
# what to watch, citing headlines; plus the day's biggest market-wide stories.
market:
  enabled: true
  indexes: {SPY: S&P 500, QQQ: Nasdaq-100, DIA: Dow, IWM: Russell 2000}
  news:
    max_age_hours: 30           # ignore older headlines
    per_ticker: 8               # headlines per stock sent to Gemini (Google News + Yahoo, fluff filtered)
    include_funds: false        # ETFs are covered by market stories instead
  news_feeds:                   # market-wide stories
    - https://news.google.com/rss/topics/CAAqJggKIiBDQkFTRWdvSUwyMHZNRGx6TVdZU0FtVnVHZ0pWVXlnQVAB?hl=en-US&gl=US&ceid=US:en
    - https://news.google.com/rss/search?q=stock+market+OR+IPO+OR+merger+when:1d&hl=en-US&gl=US&ceid=US:en
    - https://www.cnbc.com/id/20910258/device/rss/rss.html      # CNBC markets
    - https://feeds.content.dowjones.io/public/rss/mw_bulletins # MarketWatch bulletins
  max_headlines: 25
  # Names headlines use for a company, when Yahoo's legal name differs (used for news search and to check
  # that a cited headline is really about that stock). Add your own in settings.local.yaml.
  aliases: {GOOGL: [Google], "BRK-B": [Berkshire]}
  llm:
    enabled: true               # needs GEMINI_API_KEY; falls back to prices + raw headlines
  # One-time starting lists per profile, applied only while that person has no tickers in the bot.
  # After that the bot's database is the source of truth (/portfolio add|del, /watch add|del).
  seed_lists: {}                # e.g. {me: {portfolio: [IBM], watch: [KO]}} — put real ones in settings.local.yaml
  # Weekdays 8:30am PT = 2h after the US open: what's moving today.
  schedule: {day_of_week: "mon-fri", hour: 8, minute: 30}
  # Weekdays 4:30pm PT = after the close: the day's summary + what's coming (econ data, Fed, earnings, IPOs).
  evening_schedule: {day_of_week: "mon-fri", hour: 16, minute: 30}
  ahead_days: 14

# Module D — quarterly 5% categories (cards: config/cards.yaml + cards.local.yaml)
# Fully automatic: issuers email "activate your 5%" before each quarter and "activated" after. Forward those
# to the bot's Gmail (e.g. an Outlook rule); the 2-hourly Gmail check reads categories + activation status.
cards:
  enabled: true
  email:
    subject: "5%"                 # IMAP subject search
    mailboxes: [INBOX, "[Gmail]/Spam"]   # forwarded bank mail often lands in Spam
    lookback_days: 120            # announcements arrive ~a month before the quarter
    senders: [discover.com, chase.com]   # direct senders; forwarding addresses go in profiles.<id>.email_from
  quarterly_schedule: {month: "1,4,7,10", day: 1, hour: 9, minute: 0}    # this quarter's plan
  activation_reminder_schedule: {month: "1,4,7,10", day: 15, hour: 9, minute: 0}  # only if not activated

# Data retention + backups (see app/maintenance.py for what is kept how long)
maintenance:
  cleanup_schedule: {hour: 3, minute: 0}                      # nightly prune; VACUUM on Sundays
  backup_schedule: {day_of_week: sun, hour: 3, minute: 30}    # weekly SQLite backup into the nari-backups volume
  backup_keep: 8
  backup_age_recipient:         # age PUBLIC key (age1…); set in settings.local.yaml. Unset = plaintext backups

# Expenses (per person): spending reports from imported statements (and alert emails, later).
expenses:
  reports: true
  weekly_schedule: {day_of_week: sat, hour: 8, minute: 0}           # the 7 days ending Friday
  monthly_schedule: {day: 1, hour: 8, minute: 5}                    # last month; marked partial until statements arrive
  # quarterly: 1st of Jan/Apr/Jul/Oct for the quarter before; yearly: Jan 2 for the year before
  quarterly_schedule: {month: "1,4,7,10", day: 1, hour: 8, minute: 10}
  yearly_schedule: {month: 1, day: 2, hour: 9, minute: 0}

# Monitoring (app/monitoring.py): every job run is recorded; the primary profile gets a message when an
# alarm fires or recovers (any hour) and a daily reminder while one keeps firing. /status shows it all.
monitoring:
  schedule: {minute: "*/10"}    # alarm evaluation: missed runs, job failures, feature alarms (VM health)
  missed_grace_minutes: 30      # a scheduled run that hasn't started this long after its time = missed
  job_failures_critical: 3      # a failing job is 🟡; this many failed runs in a row makes it 🔴
  reminder_hours: 24

# VM health (admin only): /health on demand; alarms (via monitoring) when a threshold is crossed.
# The host watchdog (deploy/watchdog.sh, installed by deploy.sh) alarms when the bot container itself is down.
vm_health:
  enabled: true
  oci: true                     # instance-principal OCI metrics; needs the dynamic group + policy (README)
  thresholds:
    disk_warn_pct: 70           # 🟡 early warning (e.g. Docker build cache); 🔴 at disk_pct
    disk_pct: 85
    mem_pct: 90
    load_per_core: 2.0          # 15-minute load average per core
    swap_pct: 50
    restarts_24h: 3
    backup_max_age_days: 9      # weekly backups + 2 days slack
