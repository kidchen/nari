# Card catalog — PUBLIC example (committed). Put your real cards in config/cards.local.yaml
# (git-ignored), which is deep-merged over this file. Start it with `cards: {_replace: true, ...}`
# to drop this example.
#
# rates: fixed category earn rates (percent or points-per-dollar). "other" = everything else.
# rotating: quarterly 5% categories, read automatically from the issuer's emails (see settings
#           cards.email). /setcats corrects a quarter manually; the bot never guesses categories.

cards:
  example_card:
    name: Example Rotating Cash Back
    owner: me
    last4: ["1234"]               # card ending on statements (Amex: 5 digits): names + best-card check in expenses
    unit: "%"                     # or "x" for points
    rates:
      other: 1
    rotating:
      issuer: discover            # discover | chase — categories are read from that issuer's 5% emails
      confirms_activation: false  # Discover never emails an "activated" confirmation: confirm with the bot's button
      rate: 5
      cap_per_quarter: 1500       # spend cap per quarter for the 5% rate
      requires_activation: true
      calendar_url: https://www.discover.com/credit-cards/cash-back/cashback-calendar.html
      quarters: {}                # optional static fallback: "YYYYQn": [category, ...]
